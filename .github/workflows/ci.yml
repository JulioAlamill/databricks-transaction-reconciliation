name: Databricks CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run reconciliation unit tests
        run: python -m pytest tests/test_reconciliation_checks.py -v
  
  bundle-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation tools
        run: python -m pip install pyyaml

      - name: Validate YAML syntax
        run: |
          python -c "
          import yaml
          from pathlib import Path

          files = [Path('databricks.yml')]
          files += list(Path('resources').glob('*.yml'))

          for file in files:
              with file.open(encoding='utf-8') as f:
                  yaml.safe_load(f)
              print(f'VALID: {file}')
          "
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Databricks TEST bundle
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate -t test 
        
      - name: Preview TEST deployment
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle plan -t test