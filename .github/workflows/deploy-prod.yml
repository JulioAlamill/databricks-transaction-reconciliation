name: Deploy Databricks PROD

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to confirm PROD deployment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: databricks-prod-deployment
  cancel-in-progress: false

jobs:
  deploy-prod:
    name: Deploy PROD
    if: github.event.inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate PROD bundle
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate -t prod

      - name: Preview PROD deployment
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle plan -t prod

      - name: Deploy to PROD
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle deploy -t prod

      - name: Run PROD reconciliation Job
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle run reconciliation_prod_job -t prod